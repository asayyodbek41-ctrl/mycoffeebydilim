@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A120E;--card:#3B2A20;--ink:#E6D2B3;--ink2:#C68F59;--line:rgba(230,210,179,.45);--acc:#C68F59;--acc-ink:#1A120E;--hot:#C68F59;--sh:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,217,160,.08)}}
:root[data-theme="dark"]{--bg:#1A120E;--card:#3B2A20;--ink:#E6D2B3;--ink2:#C68F59;--line:rgba(230,210,179,.45);--acc:#C68F59;--acc-ink:#1A120E;--hot:#C68F59;--sh:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,217,160,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Gelasio,Georgia,serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid var(--ink2);outline-offset:3px}
#beans{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

.hero{position:relative;z-index:1;background:linear-gradient(rgba(26,18,14,.55),rgba(26,18,14,.82)),var(--bgimg) center/cover,#3B2A20;color:#E6D2B3;border-radius:0 0 40px 40px;padding:30px 22px 38px;overflow:hidden}
.hin{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{flex:none;width:clamp(100px,28vw,180px);height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 10px 26px rgba(0,0,0,.4);animation:logo .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes logo{from{opacity:0;transform:scale(.6) rotate(-25deg)}}
.ttl{text-align:right}.ttl small{display:block;font:600 clamp(1rem,3.8vw,1.7rem) Cinzel,Georgia,serif;letter-spacing:.1em;animation:slide .8s .25s both}
.ttl h1{margin:0;font:700 clamp(3rem,13vw,6.4rem)/.95 Cinzel,Georgia,serif;color:#F3E7D1;text-shadow:0 2px 0 rgba(0,0,0,.28);letter-spacing:.02em;animation:slide .8s .4s both}
.ttl .pm{color:#C68F59;display:inline-block;margin-top:-4px;font:400 clamp(1.6rem,6.4vw,2.8rem) "Kaushan Script",cursive;animation:write 1.3s .9s ease-in-out both}
@keyframes slide{from{opacity:0;transform:translateX(40px)}}@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -10px 0 0)}}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;overflow-x:auto;padding:14px 14px;scrollbar-width:none;background:var(--bg)}
.nav::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 18px;border-radius:999px;background:var(--card);color:var(--ink2);font-weight:700;box-shadow:0 4px 12px rgba(59,42,32,.18);transition:background .25s,color .25s}
.chip:active{filter:brightness(.9)}.chip.on{background:var(--acc);color:var(--acc-ink)}
.page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:10px 16px 140px}
.cat{background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:22px 26px 14px;margin:0 0 22px;scroll-margin-top:calc(84px + env(safe-area-inset-top,0px))}
.cat h2{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-size:1.45rem;font-weight:700}
.cat h2::before{content:"";flex:none;width:26px;height:15px;background:var(--hot);border-radius:80% 8% 80% 8%;transform:rotate(-8deg)}
.cat ul{list-style:none;margin:0;padding:0;columns:2 280px;column-gap:44px}
.it{display:flex;align-items:baseline;gap:10px;padding:8px 0;font-weight:700;font-size:1.12rem;break-inside:avoid;transition:color .2s}
.it:hover{color:var(--hot)}
.it i{flex:1;min-width:14px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}.it b{white-space:nowrap;font-weight:700}
.se{margin-left:8px;font-size:.72rem;font-style:normal;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--hot);color:#1A120E;vertical-align:middle}
.ban{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:36px 0 22px;padding:20px 26px;border-radius:32px;background:linear-gradient(rgba(26,18,14,.55),rgba(26,18,14,.82)),var(--bgimg) center/cover,#3B2A20;color:#E6D2B3;box-shadow:var(--sh)}
.ban img{width:84px;height:84px;border-radius:50%}.ban .ttl h1{font-size:clamp(2.4rem,9vw,4rem);animation:none}.ban .ttl small,.ban .ttl .pm{animation:none}

.foot{text-align:center;color:var(--ink2);font-weight:600;padding:10px 0 30px}.foot img{width:64px;border-radius:50%;display:block;margin:0 auto 10px}
@media (max-width:520px){.hero{padding:22px 16px 30px}.cat{padding:18px 18px 10px}.ban{padding:16px}.ban img{width:60px;height:60px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.lamp{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#E6D2B3,#C68F59 70%);box-shadow:0 0 26px 8px rgba(255,190,80,.55),0 8px 18px rgba(0,0,0,.25);display:grid;place-items:center;animation:glow 3.2s ease-in-out infinite}
.lamp svg{width:30px;height:30px}
@keyframes glow{50%{box-shadow:0 0 38px 14px rgba(255,190,80,.75),0 8px 18px rgba(0,0,0,.25)}}
.lamp[hidden],.ap[hidden]{display:none}
.ap{position:fixed;z-index:40;right:0;bottom:0;width:min(460px,100%);max-height:88vh;overflow:auto;background:radial-gradient(130% 55% at 50% -12%,rgba(198,143,89,.5),transparent 70%),var(--card);color:var(--ink);border-radius:28px 28px 0 0;box-shadow:0 -10px 50px rgba(198,143,89,.4),0 -2px 0 rgba(198,143,89,.8);padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ap .top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:16px 0 10px;background:linear-gradient(var(--card) 78%,transparent)}
.ap .top h3{margin:0;flex:1;font:700 1.2rem Cinzel,Georgia,serif}
.ap .x{width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:1.3rem}
.ap .save{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 12px;border-radius:16px;background:var(--bg);font-size:.9rem;font-weight:700}
.ap .save span{flex:1}.ap .save.dirty{outline:2px solid var(--hot)}
.ap .btn{padding:10px 18px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:700}.ap .btn:disabled{opacity:.4}
.ap select,.ap input[type=text]{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.ap .row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dotted var(--line)}
.ap .row .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}.ap .row.off .nm{opacity:.45;text-decoration:line-through}
.ap .row input[type=text]{width:112px;padding:8px 10px;text-align:right}
.ap .sw{flex:none;width:46px;height:26px;border-radius:99px;background:rgba(59,42,32,.35);position:relative;transition:background .2s}
.ap .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .2s}
.ap .sw[aria-checked=true]{background:#C68F59;box-shadow:0 0 12px rgba(198,143,89,.8)}.ap .sw[aria-checked=true]::after{transform:translateX(20px)}
.ap .del{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--bg);color:#B3261E;font-weight:700;padding:0 8px}.ap .del.sure{background:#B3261E;color:#fff}
.ap h4{margin:18px 0 8px;font-size:1rem}.ap .add{display:grid;gap:8px;padding:14px;border-radius:20px;background:var(--bg)}
.ap .add label{display:flex;gap:8px;align-items:center;font-weight:700}.ap .hint{font-size:.8rem;opacity:.7;margin:6px 2px 0}
@media (min-width:700px){.ap{right:16px;border-radius:28px 28px 0 0}}
.hin{position:relative}
.lamp{position:absolute;right:auto;top:-16px;bottom:auto;left:-2px;width:34px;height:34px;z-index:3;opacity:.4;box-shadow:none;animation:none;background:rgba(230,210,179,.18);transition:opacity .3s}
.lamp:hover,.lamp:focus-visible{opacity:.7}.lamp svg{width:24px;height:24px;stroke:#E6D2B3}

#beans{background:linear-gradient(rgba(230,210,179,.8),rgba(230,210,179,.88)),var(--bgimg2) center/cover no-repeat}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #beans{background:linear-gradient(rgba(26,18,14,.82),rgba(26,18,14,.9)),var(--bgimg2) center/cover no-repeat}}
:root[data-theme="dark"] #beans{background:linear-gradient(rgba(26,18,14,.82),rgba(26,18,14,.9)),var(--bgimg2) center/cover no-repeat}
.cat,.cat:nth-of-type(even){background:transparent;box-shadow:none;color:var(--ink);border-radius:0;border-bottom:1px solid var(--line);padding:18px 4px 10px;margin-bottom:14px}
.cat .it b,.cat:nth-of-type(even) .it b{color:var(--ink2)}
.cat .it i,.cat:nth-of-type(even) .it i{border-bottom-color:var(--line)}
.cat h2::before,.cat:nth-of-type(even) h2::before{background:var(--hot)}
.cat .se,.cat:nth-of-type(even) .se{background:var(--hot);color:#1A120E}
.cat .it:hover,.cat:nth-of-type(even) .it:hover{color:var(--hot)}
.nav{background:transparent}body::before{background:transparent}
:root{--glass:rgba(243,231,209,.58);--gb:rgba(255,255,255,.45);--gs:0 10px 30px rgba(26,18,14,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(26,18,14,.5);--gb:rgba(230,210,179,.16);--gs:0 12px 32px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--glass:rgba(26,18,14,.5);--gb:rgba(230,210,179,.16);--gs:0 12px 32px rgba(0,0,0,.4)}
.cat,.cat:nth-of-type(even){background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--gs);padding:20px 24px 12px;margin-bottom:18px}
:root{--bg:#1A120E;--card:#3B2A20;--ink:#E6D2B3;--ink2:#C68F59;--line:rgba(230,210,179,.4);--acc:#C68F59;--acc-ink:#1A120E;--hot:#C68F59;--glass:rgba(26,18,14,.55);--gb:rgba(230,210,179,.16);--gs:0 12px 32px rgba(0,0,0,.4)}
:root:not([data-theme="light"]) #beans,:root #beans{background:linear-gradient(rgba(26,18,14,.25),rgba(26,18,14,.45)),var(--bgimg2) center/cover no-repeat,#1A120E}
.hero,.ban{background:linear-gradient(rgba(26,18,14,.3),rgba(26,18,14,.62)),var(--bgimg) 50% 33%/cover no-repeat,#3B2A20}
.foot img.flogo{width:min(340px,82vw);height:auto;border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.45);margin:0 auto 12px;border:1px solid rgba(230,210,179,.18)}
.ig{display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:11px 24px;border-radius:999px;background:#C68F59;color:#1A120E;font-weight:700;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:filter .2s,transform .2s}.ig:hover{filter:brightness(1.12);transform:translateY(-1px)}.ig:focus-visible{outline:3px solid #E6D2B3;outline-offset:3px}
.qr{display:grid;place-items:center;gap:8px;padding:14px;border-radius:20px;background:var(--bg)}.qr svg{width:200px;height:200px;border-radius:10px}
.ap .row input.nmi[type=text]{flex:1;width:auto;min-width:0;padding:8px 10px;text-align:left;font-weight:700}.ap .row.off input.nmi{opacity:.45;text-decoration:line-through}.ap .tr{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--bg);padding:0 8px}.ap .trrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 9px 54px;border-bottom:1px dotted var(--line)}

 <div class="add"><label>Bo‘lim<select id="ac" aria-label="Qaysi bo‘limga qo‘shiladi">${D.cats.map((x,i)=>`<option value="${i}"${i==sel?" selected":""}>${esc(x.name)}</option>`).join("")}</select></label><input type="text" id="an" placeholder="Nomi (RU)" aria-label="Nomi"><input type="text" id="an_uz" placeholder="Nomi (UZ) — ixtiyoriy" aria-label="Nomi UZ"><input type="text" id="an_en" placeholder="Name (EN) — optional" aria-label="Name EN"><input type="text" id="ap2" inputmode="numeric" placeholder="Narxi (masalan 35000)" aria-label="Narxi"><label><input type="checkbox" id="as"> Mavsumiy</label><button class="btn" data-a="add">Qo‘shish</button></div>
  <h4>Kategoriyalar</h4><div class="add">${D.cats.map(x=>`<div><div class="row" style="border:0;padding:0"><input type="text" class="nmi" value="${esc(x.name)}" placeholder="Nomi (RU)" aria-label="Kategoriya nomi (RU)" data-a="cname" data-cid="${x.id}"><button class="tr" data-a="ctr" data-cid="${x.id}" aria-label="UZ / EN tarjima" title="UZ / EN">🌐</button></div>${trOpen==x.id?`<div class="trrow" style="padding:8px 0 0;border:0"><input type="text" value="${esc(trOf(x,"uz"))}" placeholder="UZ" aria-label="Kategoriya nomi UZ" data-a="cuz" data-cid="${x.id}"><input type="text" value="${esc(trOf(x,"en"))}" placeholder="EN" aria-label="Category name EN" data-a="cen" data-cid="${x.id}"></div>`:""}</div>`).join("")}<p class="hint">Yangi kategoriya qo‘shish</p><input type="text" id="nc" placeholder="Nomi (RU)" aria-label="Yangi kategoriya nomi RU"><input type="text" id="nc_uz" placeholder="Nomi (UZ) — ixtiyoriy" aria-label="Yangi kategoriya nomi UZ"><input type="text" id="nc_en" placeholder="Name (EN) — optional" aria-label="Yangi kategoriya nomi EN"><button class="btn" data-a="addcat">Kategoriya qo‘shish</button><p class="hint">Kategoriyada kamida bitta faol mahsulot bo‘lsa menyuda ko‘rinadi.</p></div>
  
  ${qrBlock()}`;
}
const touch=(m)=>{dirty=true;msg=m||""};
const trOf=(o,l)=>{const k=o.n!==undefined?o.n:o.name;return(o.t&&o.t[l])||(TR[k]&&TR[k][l=="uz"?0:1])||k};
const freeze=o=>{if(!o.t)o.t={uz:trOf(o,"uz"),en:trOf(o,"en")};return o.t};
const markDirty=()=>{touch();ap.querySelector(".save").classList.add("dirty");ap.querySelector(".save span").textContent="Saqlanmagan o‘zgarishlar bor";ap.querySelector("[data-a=save]").disabled=false;ap.querySelector("[data-a=undo]").disabled=false};
let saving=false;
let authed=false,fails=0,FBON=false;
const nowHM=d=>new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tashkent",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(d||new Date()).replace(/\D/g,"");
function loginView(err){ap.hidden=false;ap.innerHTML=`<div class="top">${BULB.replace('<svg','<svg width="28" height="28"')}<h3>Kirish</h3><button class="x" data-a="close" aria-label="Yopish">×</button></div><div class="add">${FBON?'<input type="text" id="lg" placeholder="Email" aria-label="Email" inputmode="email" autocapitalize="off" autocomplete="username">':""}<input type="password" id="pw" placeholder="Parol" aria-label="Parol" ${FBON?'autocomplete="current-password"':'inputmode="numeric" autocomplete="off"'}><button class="btn" data-a="login">Kirish</button><p class="hint">${err||""}</p></div>`;setTimeout(()=>{const l=$(FBON?"#lg":"#pw");l&&l.focus()},50)}
async function doLogin(){const em=FBON?$("#lg").value.trim():"",pw=$("#pw").value;await new Promise(r=>setTimeout(r,Math.min(fails,5)*600));
 if(FBON){if(!em||!pw){loginView("Email va parolni kiriting");return}try{await window.FB.login(em,pw);authed=true;fails=0;msg="";panel()}catch(e){fails++;loginView(e&&e.code=="auth/too-many-requests"?"Juda ko‘p urinish. Keyinroq qayta urinib ko‘ring":"Email yoki parol noto‘g‘ri")}return}
 const p=pw.replace(/\D/g,"");if(p&&(p==nowHM()||p==nowHM(new Date(Date.now()-60000)))){authed=true;fails=0;msg="";panel()}else{fails++;loginView("Parol noto‘g‘ri")}}
function openPanel(v){ap.hidden=!v;if(!v){if(!FBON)authed=false;return}if(FBON)authed=!!window.FB.user();authed?panel():loginView()}
ap.addEventListener("keydown",e=>{if(e.key=="Enter"&&(e.target.id=="lg"||e.target.id=="pw")){e.preventDefault();doLogin()}});
lamp.onclick=()=>openPanel(true);
addEventListener("keydown",e=>{if(e.key=="Escape"&&!ap.hidden)openPanel(false)});
ap.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,c=D.cats[sel],it=c.items.find(i=>i.id==b.dataset.id);
 if(a=="close")openPanel(false);
 else if(a=="login")doLogin();
  else if(a=="fx"){D.fx=D.fx===false;touch();setSeason();panel()}
  else if(a=="tog"&&it){it.on=it.on===false;touch();panel()}
 else if(a=="del"&&it){if(b.classList.contains("sure")){c.items=c.items.filter(i=>i!=it);touch();panel()}else{b.classList.add("sure");b.textContent="Ha?";setTimeout(()=>{b.classList.remove("sure");b.textContent="🗑"},3000)}}
 else if(a=="add"){const n=$("#an").value.trim(),p=fmt($("#ap2").value);if(!n||!p){msg="Nomi va narxini kiriting";panel();return}const k=+$("#ac").value;const tu=$("#an_uz").value.trim(),te=$("#an_en").value.trim();D.cats[k].items.push({id:uid(),n,p,s:$("#as").checked,on:true,t:{uz:tu||n,en:te||n}});sel=k;touch();panel()}
 else if(a=="tr"&&it){trOpen=trOpen==it.id?"":it.id;panel()}
  else if(a=="logout"){window.FB.logout().then(()=>{authed=false;openPanel(false)})}
  else if(a=="ctr"){trOpen=trOpen==b.dataset.cid?"":b.dataset.cid;panel()}
  else if(a=="addcat"){const n=$("#nc").value.trim();if(!n){msg="Bo‘lim nomini kiriting";panel();return}const tu=$("#nc_uz").value.trim(),te=$("#nc_en").value.trim();D.cats.push({id:"c"+uid().slice(1),name:n,t:{uz:tu||n,en:te||n},items:[]});sel=D.cats.length-1;touch("Yangi bo‘lim qo‘shildi — endi mahsulot qo‘shing");panel()}
  else if(a=="undo"){D.cats=JSON.parse(JSON.stringify(S.cats));D.season=S.season;D.fx=S.fx;D.auth=S.auth;setSeason();dirty=false;msg="";panel()}
 else if(a=="save")save();
});
ap.addEventListener("change",e=>{const t=e.target;if(t.dataset.a=="cat"){sel=+t.value;panel()}else if(t.dataset.a=="season"){D.season=t.value;setSeason();touch();panel()}else if(["name","tuz","ten"].includes(t.dataset.a)){const it=D.cats[sel].items.find(i=>i.id==t.dataset.id);if(!it)return;const v=t.value.trim(),k=t.dataset.a;freeze(it);if(k=="name"){if(!v){t.value=it.n;return}it.n=v}else{const l=k=="tuz"?"uz":"en";if(v)it.t[l]=v;else t.value=trOf(it,l)}markDirty()}else if(["cname","cuz","cen"].includes(t.dataset.a)){const c=D.cats.find(x=>x.id==t.dataset.cid);if(!c)return;const v=t.value.trim(),k=t.dataset.a;freeze(c);if(k=="cname"){if(!v){t.value=c.name;return}c.name=v}else{const l=k=="cuz"?"uz":"en";if(v)c.t[l]=v;else t.value=trOf(c,l)}touch();panel()}else if(t.dataset.a=="price"){const it=D.cats[sel].items.find(i=>i.id==t.dataset.id);if(!it)return;it.p=fmt(t.value)||it.p;t.value=it.p;touch();ap.querySelector(".save").classList.add("dirty");ap.querySelector(".save span").textContent="Saqlanmagan o‘zgarishlar bor";ap.querySelector('[data-a=save]').disabled=false;ap.querySelector('[data-a=undo]').disabled=false}});
function buildDoc(){
 const r=document.documentElement.cloneNode(true);
 ["#nav","#menu","#beans","#ap","#lamp"].forEach(s=>{const e=r.querySelector(s);if(e){e.innerHTML="";if(s=="#ap"||s=="#lamp")e.hidden=true}});
 r.querySelectorAll("img[data-logo]").forEach(i=>i.removeAttribute("src"));r.querySelectorAll("#seasonfx,#seasonstyle,[data-deco],[data-ui]").forEach(e=>e.remove());
 r.querySelector("#menu-data").textContent=JSON.stringify(D).replace(/</g,"\\u003c");
 return"<!doctype html>\n"+r.outerHTML;
}
async function save(){
  if(!FBON&&!art){msg="Saqlash ulanmagan: Firebase sozlanmagan";panel();return}
  if(saving)return;saving=true;
  msg="Saqlanmoqda…";panel();
  try{if(FBON){await window.FB.save({cats:JSON.parse(JSON.stringify(D.cats)),season:D.season||"auto",fx:D.fx!==false,updated:Date.now()})}else await art.publish(buildDoc());dirty=false;msg="Saqlandi ✓";S.cats=JSON.parse(JSON.stringify(D.cats));S.season=D.season;S.fx=D.fx;S.auth=D.auth;render();setSeason();panel()}
  catch(e){
    if(e&&e.code=="conflict"){try{sessionStorage.setItem("mc_pending",JSON.stringify(D))}catch(_){}msg="Sahifa boshqa joyda o‘zgargan. Sahifani yangilang — o‘zgarishlaringiz tiklanadi";}
    else msg=e&&(e.code=="not_writer"||e.code=="not_granted"||e.code=="permission-denied")?"Saqlash huquqingiz yo‘q":"Saqlab bo‘lmadi ("+(e&&e.code||"xato")+"). Qayta urinib ko‘ring";
    panel();
  }
  finally{saving=false}
}
try{const q=sessionStorage.getItem("mc_pending");if(q){sessionStorage.removeItem("mc_pending");const P=JSON.parse(q);if(P&&P.cats){D.cats=P.cats;if(P.season)D.season=P.season;if(P.fx!==undefined)D.fx=P.fx;if(P.auth)D.auth=P.auth;dirty=true;msg="Oldingi o‘zgarishlar tiklandi — Saqlashni bosing"}}}catch(_){}
setSeason();
async function fbBoot(){const F=window.FB;if(!F||FBON)return;FBON=true;try{const d=await F.load();if(d&&Array.isArray(d.cats)&&d.cats.length&&!dirty){D.cats=d.cats;D.season=d.season;D.fx=d.fx;S.cats=JSON.parse(JSON.stringify(D.cats));S.season=D.season;S.fx=D.fx;render();setSeason()}}catch(e){console.warn("Firestore o‘qib bo‘lmadi",e)}}
if(window.FB)fbBoot();else addEventListener("fb-ready",fbBoot);
(async()=>{try{if(!window.claude)return;art=await claude.use("artifact");}catch(e){}})();

</script>
